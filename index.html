    <script>
        function checkForAlerts() {
            if (localStorage.getItem('user_type') === 'Admin') {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'php/check_alert.php', true);
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        var response = JSON.parse(xhr.responseText);
                        if (response.new_alert) {
                            response.alerts.forEach(function(userName) {
                                alert(userName + ' wants permission!');
                            });
                            document.getElementById('main-iframe').src = 'settings.html'; 
                        }
                    }
                };
                xhr.send();
            }
        }

        setInterval(checkForAlerts, 500);
    </script>

    <script>
        function openPage(pageUrl) {
            document.getElementById('main-iframe').src = pageUrl;
        }

        var userType = localStorage.getItem('user_type');

        if (userType) {
            document.getElementById('userType').textContent = userType;
        }

        function logout() {
            localStorage.removeItem('user_type');
            localStorage.removeItem('loggedIn');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', function () {
        var userType = localStorage.getItem('user_type');

        if (!userType) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userType').textContent = userType;

            if (userType === 'User') {
                var adminOnlyElements = document.getElementsByClassName('admin-only');
                for (var i = 0; i < adminOnlyElements.length; i++) {
                    adminOnlyElements[i].style.display = 'none';
                }
            }
        }
    });

    var navLinks = document.querySelectorAll('.nav-link[data-page]');
    navLinks.forEach(function(link) {
        link.addEventListener('click', function() {
            var page = this.getAttribute('data-page');
            var iframe = document.getElementById('main-iframe');

            if (iframe) {
                iframe.src = page;
                console.log('Loading page:', page);
            } else {
                console.error('Iframe not found');
            }
        });
    });

    function refreshIframe() {
            const iframe = document.getElementById('main-iframe');
            iframe.src = iframe.src;
        }

        window.onload = refreshIframe;
    </script>
