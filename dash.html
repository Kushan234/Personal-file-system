<script>
   
    function fetchUserCount() {
        fetch('php/user_count.php') 
            .then(response => response.json())
            .then(data => {
              
                document.querySelector('.user-count').textContent = data.user_count;
            })
            .catch(error => console.error('Error fetching user count:', error));
    }

 
    document.addEventListener('DOMContentLoaded', fetchUserCount);




    document.addEventListener('DOMContentLoaded', () => {
    fetch('php/user_position_count.php')
        .then(response => response.json())
        .then(data => {
            updateDonutChart(data);
        })
        .catch(error => console.error('Error fetching user position count:', error));
});





function updateDonutChart(data) {
    const chart = document.getElementById('donut-chart');
    const legend = document.getElementById('legend');
    
    const colors = ['#4CAF50', '#2196F3', '#FF9800', '#E91E63', '#1ee928', '#082040', '#fa1717', '#d5e91e', '#b01ee9', '#1b1733'];
    
  
    let total = 0;
    data.forEach(item => total += parseInt(item.count));
    
    let gradient = [];
    let startAngle = 0;
    
    data.forEach((item, index) => {
        const count = parseInt(item.count);
        const percentage = (count / total) * 100;
        const endAngle = startAngle + percentage;
        
       
        gradient.push(`${colors[index]} ${startAngle}% ${endAngle}%`);
        
     
        const legendItem = document.createElement('div');
        legendItem.classList.add('legend-item');
        legendItem.innerHTML = `<span class="legend-color" style="background-color: ${colors[index]}"></span> 
            <span>${item.position} - ${percentage.toFixed(2)}%</span>`;
        legend.appendChild(legendItem);
        
        startAngle = endAngle;
    });
    
   
    chart.style.background = `conic-gradient(${gradient.join(', ')})`;
}


function fetchPermanentCount() {
    fetch('php/permanent_count.php')
        .then(response => response.json())
        .then(data => {
            
            if (data.permanent_count !== undefined) {
                document.querySelector('.permanent-count').textContent = data.permanent_count;
            } else {
                console.error('Error fetching permanent count:', data.error);
            }
        })
        .catch(error => console.error('Error fetching permanent count:', error));
}


document.addEventListener('DOMContentLoaded', fetchPermanentCount);

document.addEventListener('DOMContentLoaded', () => {
    fetchLatestUsers();
});




function fetchLatestUsers() {
    fetch('php/get_latest_users.php') 
        .then(response => response.json())
        .then(data => {
            const newUserDetails = document.querySelector('.new-user-details');
            newUserDetails.innerHTML = ''; 

            data.forEach(user => {
                const userElement = document.createElement('div');
                userElement.classList.add('user-card');
                userElement.innerHTML = `
                    <img src="${user.photo}" alt="${user.name1}" class="user-photo" />
                    <p class="user-name">${user.name1}</p>
                `;
                newUserDetails.appendChild(userElement);
            });
        })
        .catch(error => console.error('Error fetching latest users:', error));
}

</script>
