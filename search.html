<script>
    function viewFilter() {
            document.getElementById('filterId').classList.remove('d-none');
        }

        function closeFilter() {
            document.getElementById('filterId').classList.add('d-none');
        }
</script>

<script>
    let currentPage = 1;
    const rowsPerPage = 15;
    let employeeData = [];

    fetch('php/fetch_salary_increment.php')
    .then(response => response.json())
    .then(data => {
        employeeData = data;
        displayTableData(currentPage); 
        updateButtons();
    })
    .catch(error => {
        console.error('Error fetching data:', error);
    });

    function updateButtons() {
    const totalPages = Math.ceil(employeeData.length / rowsPerPage);

    document.getElementById('prev-btn').disabled = currentPage === 1;
    document.getElementById('next-btn').disabled = currentPage === totalPages;
    }


    document.getElementById('prev-btn').addEventListener('click', () => {
    if (currentPage > 1) {
        currentPage--;
        displayTableData(currentPage);
        updateButtons();
    }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
    const totalPages = Math.ceil(employeeData.length / rowsPerPage);
    if (currentPage < totalPages) {
        currentPage++;
        displayTableData(currentPage);
        updateButtons();
    }
    });

    document.getElementById('print-btn').addEventListener('click', () => {
        window.print();  
    });

</script>
