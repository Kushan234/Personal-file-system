<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salary Increment</title>
    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="CSS/table.css" />
  </head>
  <body>
  
    <div class="form-table">
      <h2 class="text-center">Employee Information</h2>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Employee ID</th>
              <th>Name</th>
              <th>Position</th>
              <th>Appointment Date</th>
              <th>NIC</th>
              <th>Date of Birth</th>
              <th>Address</th>
              <th>Email</th>
              <th>WhatsApp</th>
            </tr>
          </thead>
          <tbody id="employee-data">
          </tbody>
        </table>
      </div>
  
      <div class="row">
          <div class="print-button col-12 col-lg-6">
            <button id="print-btn" class="ms-5">
              <img class="print-img" src="img/print.png" alt="" style="height: 24px; width: 24px;">
            </button>
          </div>
          <div class="btn-group col-12 col-lg-6">
            <button id="prev-btn" class="btn-primary" disabled>Previous</button>
            <span class="page-num" id="page-num">Page 1</span>
            <button id="next-btn" class="btn-primary me-4">Next</button>
          </div>
      </div>
  </div>

<script>
        let currentPage = 1;
        const rowsPerPage = 10;
        let employeeData = [];

        fetch('php/fetch_salary_increment.php')
    .then(response => response.json())
    .then(data => {
        employeeData = data;
        displayTableData(currentPage); 
        updateButtons();
    })
    .catch(error => {
        console.error('Error fetching data:', error);
    });
    
    
    function displayTableData(page) {
    const tbody = document.getElementById('employee-data');
    tbody.innerHTML = ''; 

    const start = (page - 1) * rowsPerPage;
    const end = start + rowsPerPage;
    const pageData = employeeData.slice(start, end);

    pageData.forEach(employee => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${employee.employee_id}</td>
            <td>${employee.name1}</td>
            <td>${employee.position}</td>
            <td>${employee.appointment_date}</td>
            <td>${employee.nic}</td>
            <td>${employee.dob}</td>
            <td>${employee.address1}</td>
            <td>${employee.email}</td>
            <td>${employee.whatsapp}</td>
        `;
        tbody.appendChild(row);
    });

    
    document.getElementById('page-num').innerText = `Page ${page}`;
}


function updateButtons() {
    const totalPages = Math.ceil(employeeData.length / rowsPerPage);

    document.getElementById('prev-btn').disabled = currentPage === 1;
    document.getElementById('next-btn').disabled = currentPage === totalPages;
}


document.getElementById('prev-btn').addEventListener('click', () => {
    if (currentPage > 1) {
        currentPage--;
        displayTableData(currentPage);
        updateButtons();
    }
});

document.getElementById('next-btn').addEventListener('click', () => {
    const totalPages = Math.ceil(employeeData.length / rowsPerPage);
    if (currentPage < totalPages) {
        currentPage++;
        displayTableData(currentPage);
        updateButtons();
    }
});

fetch('php/fetch_salary_increment.php')
    .then(response => response.json())
    .then(data => {
        employeeData = data;
        if (employeeData.length === 0) {
            // If there is no data, hide the print and next buttons
            document.getElementById('print-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        } else {
            // Data exists, display the buttons and data
            displayTableData(currentPage);
            updateButtons();
        }
    })
    .catch(error => {
        console.error('Error fetching data:', error);
    });

document.getElementById('print-btn').addEventListener('click', () => {
  const currentTableContent = document.getElementById('employee-data').innerHTML;


displayAllDataForPrint();
window.print();


document.getElementById('employee-data').innerHTML = currentTableContent;
displayTableData(currentPage); 
});

function displayAllDataForPrint() {
const tbody = document.getElementById('employee-data');
tbody.innerHTML = '';

employeeData.forEach((employee) => {
  const row = document.createElement('tr');
  row.innerHTML = `
    <td>${employee.employee_id}</td>
    <td>${employee.name1}</td>
    <td>${employee.position}</td>
    <td>${employee.appointment_date}</td>
    <td>${employee.nic}</td>
    <td>${employee.dob}</td>
    <td>${employee.address1}</td>
    <td>${employee.email}</td>
    <td>${employee.whatsapp}</td>
  `;
  tbody.appendChild(row);
});
}
</script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
