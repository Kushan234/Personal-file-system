<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .accordion-button {
            font-size: 1.25rem;
            font-weight: bold;
            color: #007bff;
            text-align: left;
            border: none;
            background: #f8f9fa;
            transition: background-color 0.3s, color 0.3s;
        }

        /* .accordion-button:hover {
            background-color: #e9ecef;
            color: #0056b3;
        } */

        .accordion-button:focus {
            box-shadow: none;
            outline: none;
        }

        .accordion-button.collapsed {
            color: #64686e;
            background-color: #f8f9fa;
        }

        .accordion-card {
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
        }

        .accordion-card-header {
            color: #fff;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid #0069d9;
        }

        .accordion-card-body {
            padding: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div id="accordion">

            <div class="card mb-4 accordion-card">
                <div class="card-header accordion-card-header" id="headingOne">
                    <h4 class="mb-0">
                        <button class="accordion-button" type="button" data-toggle="collapse" data-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                            Add New User
                        </button>
                    </h4>
                </div>
                <div id="collapseOne" class="collapse show" aria-labelledby="headingOne" data-parent="#accordion">
                    <div class="card-body accordion-card-body">
                        <form id="addUserForm">
                            <div class="form-group">
                                <label for="username">User Name:</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password:</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="form-group">
                                <label for="user_type">User Type:</label>
                                <select class="form-control" id="user_type" name="user_type">
                                    <option value="Admin">Admin</option>
                                    <option value="User">User</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Add User</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="card mb-4 accordion-card">
                <div class="card-header accordion-card-header" id="headingTwo">
                    <h4 class="mb-0">
                        <button class="accordion-button collapsed" type="button" data-toggle="collapse" data-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                            Change Password
                        </button>
                    </h4>
                </div>
                <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordion">
                    <div class="card-body accordion-card-body">
                        <form id="changePasswordForm">
                            <div class="form-group">
                                <label for="change_username">User Name:</label>
                                <input type="text" class="form-control" id="change_username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="old_password">Old Password:</label>
                                <input type="password" class="form-control" id="old_password" name="old_password" required>
                            </div>
                            <div class="form-group">
                                <label for="new_password">New Password:</label>
                                <input type="password" class="form-control" id="new_password" name="new_password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Change Password</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="card accordion-card">
                <div class="card-header accordion-card-header" id="headingThree">
                    <h4 class="mb-0">
                        <button class="accordion-button collapsed" type="button" data-toggle="collapse" data-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                            Manage User Permissions
                        </button>
                    </h4>
                </div>
                <div id="collapseThree" class="collapse" aria-labelledby="headingThree" data-parent="#accordion">
                    <div class="card-body accordion-card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>User Name</th>
                                    <th>User Type</th>
                                    <th>Permission</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="userTable">
                                <!-- User Data -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#addUserForm').on('submit', function(e) {
                e.preventDefault();
                
                let username = $('#username').val();
                let password = $('#password').val();
                let userType = $('#user_type').val();
    
                $.ajax({
                    url: 'php/add_user.php',
                    type: 'POST',
                    data: { name: username, password: password, user_type: userType },
                    success: function(response) {
                        alert(response);
                        $('#addUserForm')[0].reset();
                        loadUsers();
                    }
                });
            });
    
            function loadUsers() {
                $.ajax({
                    url: 'php/get_user.php',
                    type: 'GET',
                    success: function(data) {
                        $('#userTable').html(data);
                    }
                });
            }
    
            $(document).on('click', '.give-permission', function() {
    let userId = $(this).data('id');

    $.ajax({
        url: 'php/give_permission.php',
        type: 'POST',
        data: { user_id: userId },
        success: function(response) {
            const result = JSON.parse(response);
            alert(result.message);

            if (result.status === 'success') {
                // Check if permission was granted
                if (result.can_edit_profiles) {
                    // Update local storage or flag to allow editing
                    localStorage.setItem('can_edit_profiles', '1');
                    alert('You now have permission to edit profiles.');
                } else {
                    // Clear permission if revoked
                    localStorage.removeItem('can_edit_profiles');
                }
                loadUsers(); // Refresh the user list
            }
        }
    });
});
    
            $(document).on('click', '.delete-user', function() {
                if (confirm('Are you sure you want to delete this user?')) {
                    let userId = $(this).data('id');
    
                    $.ajax({
                        url: 'php/delete_user.php',
                        type: 'POST',
                        data: { user_id: userId },
                        success: function(response) {
                            alert(response);
                            loadUsers();
                        }
                    });
                }
            });
    
            $('#changePasswordForm').on('submit', function(e) {
                e.preventDefault();

                let username = $('#change_username').val();
                let currentPassword = $('#old_password').val();
                let newPassword = $('#new_password').val();

                $.ajax({
                    url: 'php/change_password.php',
                    type: 'POST',
                    data: {
                        username: username,
                        current_password: currentPassword,
                        new_password: newPassword
                    },
                    success: function(response) {
                        alert(response);
                        $('#changePasswordForm')[0].reset();
                    }
                });
            });

            loadUsers();
        });
    </script>
</body>
</html>
